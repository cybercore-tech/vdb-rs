[package]
name = "vdb"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Embedded, crash-safe, Rust-native vector database (LMDB metadata + mmap'd vectors/HNSW index)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cybercore-tech/vdb-rs"
keywords = ["vector-database", "embedded", "ann", "hnsw", "lmdb"]
categories = ["database-implementations", "data-structures"]

[features]
default = ["storage", "index-hnsw", "metrics", "serde-query"]
# LMDB (via heed) KV substrate + mmap'd .vectors files. See ADR-0001.
# serde/serde_json are required here (not just by serde-query) because
# heed's SerdeJson codec is what KvEngine uses to store collection configs.
# byteorder is required directly: heed's U64<Endian> key codec (used for
# the vectors/metadata/logs tables) is not re-exported by heed itself.
storage = ["dep:heed", "dep:memmap2", "dep:serde", "dep:serde_json", "dep:byteorder", "dep:fs2"]
# mmap'd HNSW .index files. See ADR-0002. Requires storage's mmap plumbing.
index-hnsw = ["storage"]
# Distance/similarity metric implementations (cosine, euclidean, dot).
metrics = []
# Query-builder filter DSL (de)serialization.
serde-query = ["dep:serde", "dep:serde_json"]
# Reserved capability; no public implementation yet (see docs/roadmap.md).
quantization = ["dep:half"]
# Reserved capability; no public implementation yet (see docs/roadmap.md).
index-ivf = ["storage"]
# Reserved capability; no public implementation yet (see docs/roadmap.md).
async = ["dep:tokio"]

[dependencies]
fs2 = { version = "0.4", optional = true }
thiserror = "1"
heed = { version = "0.22", default-features = false, features = ["serde-json"], optional = true }
memmap2 = { version = "0.9", optional = true }
byteorder = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
half = { version = "2", optional = true }
tokio = { version = "1", features = ["rt", "sync"], optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[[example]]
name = "basic"
required-features = ["storage", "metrics", "serde-query"]

[[example]]
name = "benchmark"
required-features = ["storage", "metrics", "serde-query", "index-hnsw"]

[[example]]
name = "semantic_search"
required-features = ["storage", "metrics", "serde-query", "index-hnsw"]
