name: Release signed crate
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches package version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'tag/package version mismatch'
          PY
      - run: ./scripts/release-gates.sh
      - uses: actions/upload-artifact@v4
        with:
          name: verified-crate
          path: target/package/*.crate
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-crate
          path: dist
      - name: Generate checksum manifest
        working-directory: dist
        run: sha256sum ./*.crate > SHA256SUMS
      - uses: sigstore/cosign-installer@v3.7.0
      - name: Sign manifest using GitHub OIDC
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.bundle dist/SHA256SUMS
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.crate dist/SHA256SUMS dist/SHA256SUMS.bundle \
            --draft "${prerelease[@]}" --generate-notes \
            --title "vdb ${GITHUB_REF_NAME#v}"
