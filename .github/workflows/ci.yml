name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install and run pinned actionlint
        run: |
          GOBIN="$RUNNER_TEMP/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/actionlint-bin/actionlint"
      - name: Check local semantic-search preparation helpers
        run: python3 -m unittest discover -s scripts/tests

      - name: Validate shell syntax
        run: bash -n scripts/*.sh scripts/release-gates

  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check diff whitespace
        run: git diff --check

      - name: Clippy
        run: >
          cargo clippy --locked
          --workspace
          --all-targets
          --
          -D warnings

      - name: Clippy all features
        run: >
          cargo clippy --locked
          --workspace
          --all-targets
          --all-features
          --
          -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2

      - name: Check default features
        run: >
          cargo check --locked
          --workspace
          --all-targets

      - name: Test default features
        run: >
          cargo test --locked
          --workspace
          --all-targets

      - name: Check all features
        run: >
          cargo check --locked
          --workspace
          --all-targets
          --all-features

      - name: Test all features
        run: >
          cargo test --locked
          --workspace
          --all-features
          --lib
          --tests

      - name: Test all-feature rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo test --locked
          --workspace
          --doc
          --all-features

      - name: Build strict rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo doc --locked
          --workspace
          --no-deps
          --all-features

      - name: Feature isolation — no default features
        run: cargo check --locked --workspace --no-default-features

      - name: Feature isolation
        run: ./scripts/validate-features.sh

      - name: Test semantic search with frozen real embeddings (offline)
        run: cargo test --locked --all-features --example semantic_search

      - name: Run public API example
        run: cargo run --locked --example basic

      - name: Batch ingestion and incremental HNSW benchmark smoke test
        if: runner.os == 'Linux'
        run: cargo run --locked --release --example benchmark -- 128 16 5 32

  package:
    name: Package readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Inspect package contents
        run: cargo package --locked --list -p cybercore-vdb

      - name: Build and verify distributable crate
        run: ./scripts/validate-package.sh

      - name: Upload verified crate
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vdb-crate
          path: target/package/*.crate
          if-no-files-found: error

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2

      - name: Verify locked dependencies on MSRV
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check all targets and features on MSRV
        run: >
          cargo check --locked
          --workspace
          --all-targets
          --all-features

      - name: Test all targets and features on MSRV
        run: >
          cargo test --locked
          --workspace
          --all-features
          --lib
          --tests

      - name: Test semantic search on MSRV (offline)
        run: cargo test --locked --all-features --example semantic_search

      - name: Test rustdoc examples on MSRV
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo test --locked
          --workspace
          --doc
          --all-features

      - name: Build rustdoc on MSRV
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo doc --locked
          --workspace
          --no-deps
          --all-features
